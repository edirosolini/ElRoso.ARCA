name: Release

# EN: Triggered by semver tags. Tag format: v1.2.3, v1.2.3-preview.1, v1.2.3-rc.1, etc.
# ES: Se dispara con tags semver. Formato: v1.2.3, v1.2.3-preview.1, v1.2.3-rc.1, etc.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without leading v, e.g. 1.0.0-preview.1)'
        required: true
        type: string
  # EN: Called by "Tag on version bump" right after it creates the tag. A tag pushed with
  #     GITHUB_TOKEN does not trigger the push trigger above, so that job calls this one directly.
  # ES: Lo llama "Tag on version bump" apenas crea el tag. Un tag pusheado con GITHUB_TOKEN no
  #     dispara el trigger de arriba, así que ese job llama a éste directamente.
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (without leading v)'
        required: true
        type: string

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CONFIGURATION: 'Release'

jobs:
  release:
    name: Build, test and publish to NuGet.org
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required to create a GitHub Release
      packages: write   # not used (publishing to nuget.org, not GH Packages) but harmless
      id-token: write   # OIDC token for NuGet Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SourceLink needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version from tag or input
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Strip leading 'v' from refs/tags/vX.Y.Z
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Sanity check: must look like X.Y.Z[-suffix]
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.\-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not a valid SemVer (X.Y.Z[-suffix])"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION" >> "$GITHUB_STEP_SUMMARY"

          # EN: The GitHub Release needs a tag that actually exists. On a tag push it is the ref we
          #     are on; when called by the tagger the tag was just pushed, so look it up. A manual
          #     dispatch may have no tag at all — leave it empty and skip the Release step.
          # ES: El GitHub Release necesita un tag que exista de verdad. En un push de tag es la ref
          #     en la que estamos; si nos llama el tagger, el tag se acaba de pushear, así que se
          #     busca. Un dispatch manual puede no tener tag — queda vacío y se saltea ese paso.
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore ElRoso.ARCA.sln

      - name: Build
        run: |
          dotnet build ElRoso.ARCA.sln \
            -c ${{ env.CONFIGURATION }} \
            --no-restore \
            -p:Version=${{ steps.version.outputs.value }} \
            -p:ContinuousIntegrationBuild=true

      - name: Test (gate the release)
        run: |
          dotnet test tests/ElRoso.ARCA.Tests/ElRoso.ARCA.Tests.csproj \
            -c ${{ env.CONFIGURATION }} \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: Pack
        run: |
          dotnet pack ARCA/ElRoso.ARCA.csproj \
            -c ${{ env.CONFIGURATION }} \
            --no-build \
            -p:Version=${{ steps.version.outputs.value }} \
            -p:ContinuousIntegrationBuild=true \
            --output ./nupkg

      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: edirosolini

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # Push both nupkg and snupkg (symbols) so consumers can step into the source.
          # Pushea nupkg y snupkg (símbolos) para que consumidores puedan debuggear el código.
          dotnet nuget push './nupkg/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-${{ steps.version.outputs.value }}
          path: ./nupkg/*.*nupkg
          retention-days: 90

      - name: Create GitHub Release
        if: steps.version.outputs.tag != ''  # skipped by a manual dispatch with no tag behind it
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
