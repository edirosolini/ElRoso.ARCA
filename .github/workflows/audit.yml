name: Audit

# Audita las dependencias NuGet todos los lunes 08:00 AR, aunque no haya commits, y avisa por Telegram si encuentra High o Critical.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  audit:
    name: NuGet vulnerable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # Sin NuGetAudit para que el gate no corte el restore antes del listado.
      - name: Restore
        run: dotnet restore ElRoso.ARCA.sln -p:NuGetAudit=false

      - name: List vulnerable packages
        run: |
          set -uo pipefail
          output=$(dotnet list ElRoso.ARCA.sln package --vulnerable --include-transitive --no-restore 2>&1) || {
            printf '%s\n' "$output"
            echo "::error::No se pudo escanear la solución."
            exit 2
          }
          printf '%s\n' "$output"
          hits=$(printf '%s\n' "$output" | grep -E '^[[:space:]]*>.*[[:space:]](High|Critical)[[:space:]]' || true)
          if [ -n "$hits" ]; then
            echo "::error::Hay paquetes con vulnerabilidad High o Critical."
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "Sin High ni Critical en los paquetes NuGet."

      - name: Notify Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_NOTIFIER_TOKEN }}
          TELEGRAM_IDS: ${{ secrets.TELEGRAM_NOTIFIER_RECIPIENT_IDS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${TELEGRAM_TOKEN:-}" ] || [ -z "${TELEGRAM_IDS:-}" ]; then
            echo "::warning::Faltan los secrets TELEGRAM_NOTIFIER_*: no se avisó."
            exit 1
          fi
          text="Auditoría semanal de ElRoso.ARCA: hay High/Critical o no se pudo escanear. ${RUN_URL}"
          rc=0
          for id in ${TELEGRAM_IDS//[;,]/ }; do
            curl -fsS --max-time 30 -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${id}" --data-urlencode "text=${text}" || rc=1
          done
          exit "$rc"
